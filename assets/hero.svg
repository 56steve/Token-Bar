<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">token-bar example output</title>
  <desc id="desc">Two usage bars: 5-hour usage at 21 percent and weekly usage at 78 percent, each with the time to the next percent and the time until reset. Example numbers.</desc>
  <rect width="760" height="300" rx="16" fill="#0f1115"/>
  <rect x="1" y="1" width="758" height="298" rx="15" fill="none" stroke="#2a2f3a"/>

  <text x="36" y="52" fill="#e8eaf0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700">token-bar</text>
  <text x="36" y="76" fill="#8b93a7" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">Know how close you are to your limit, before you hit it.</text>

  <text x="36" y="122" fill="#e8eaf0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">5-hour usage</text>
  <text x="724" y="122" fill="#e8eaf0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" text-anchor="end">21%</text>
  <rect x="36" y="132" width="688" height="12" rx="6" fill="#1d212b"/>
  <rect x="36" y="132" width="144" height="12" rx="6" fill="#3ddc97"/>
  <text x="36" y="166" fill="#8b93a7" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13">next point 22% in about 23 min   |   resets in 1h 1m</text>

  <text x="36" y="214" fill="#e8eaf0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">Weekly usage</text>
  <text x="724" y="214" fill="#e8eaf0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" text-anchor="end">78%</text>
  <rect x="36" y="224" width="688" height="12" rx="6" fill="#1d212b"/>
  <rect x="36" y="224" width="536" height="12" rx="6" fill="#f5a524"/>
  <text x="36" y="258" fill="#8b93a7" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13">next point 79% in about 47 min   |   resets in 2d 16h</text>

  <text x="724" y="284" fill="#5b6275" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end">Example numbers</text>
</svg>
