name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# The workflow only reads the repo, so it gets no write access.
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        # 3.9 is what macOS ships, and the plugin promises to work with it.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Claude Code plugin tests
        working-directory: plugins/token-bar
        run: python -m unittest discover -s tests
      - name: Codex plugin tests
        working-directory: plugins/token-bar-codex
        run: python -m unittest discover -s tests

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.12.0
      - run: ruff check plugins

  rust:
    name: Rust (test and clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
